<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Yadi — Computer Science and Multi-Agent AI</title>
  <desc id="desc">A futuristic developer banner for Yadi0823 featuring Java, TypeScript, and a four-agent AI network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A13" />
      <stop offset="0.52" stop-color="#0A1022" />
      <stop offset="1" stop-color="#11112B" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="0.55" stop-color="#70A5FD" />
      <stop offset="1" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC" />
      <stop offset="0.55" stop-color="#C4E7FF" />
      <stop offset="1" stop-color="#C4B5FD" />
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.34" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.28" />
      <stop offset="1" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6EA8FE" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <clipPath id="round"><rect width="1200" height="360" rx="28" /></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)" />
    <rect width="1200" height="360" fill="url(#grid)" />
    <circle cx="900" cy="62" r="260" fill="url(#glowCyan)" />
    <circle cx="1138" cy="316" r="250" fill="url(#glowPurple)" />
    <path d="M0 304 C265 248 445 372 706 304 S1014 248 1200 287" fill="none" stroke="#70A5FD" stroke-opacity="0.12" stroke-width="2" />
    <path d="M0 322 C265 266 445 390 706 322 S1014 266 1200 305" fill="none" stroke="#A855F7" stroke-opacity="0.1" stroke-width="1" />

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <rect x="64" y="46" width="244" height="30" rx="15" fill="#10192F" stroke="#22D3EE" stroke-opacity="0.65" />
      <circle cx="84" cy="61" r="7" fill="#34D399" opacity="0.18" />
      <circle cx="84" cy="61" r="4" fill="#34D399" />
      <text x="98" y="66" fill="#A5F3FC" font-size="13" font-weight="700" letter-spacing="1.6">YADI0823 // PROFILE</text>

      <text x="62" y="158" fill="url(#headline)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="9">YADI</text>
      <rect x="66" y="173" width="494" height="3" rx="2" fill="url(#edge)" />
      <text x="66" y="211" fill="#DCEBFF" font-size="22" font-weight="700" letter-spacing="1.1">COMPUTER SCIENCE · MULTI-AGENT AI</text>

      <g font-size="14" font-weight="700" letter-spacing="1">
        <rect x="66" y="234" width="92" height="34" rx="9" fill="#11243A" stroke="#22D3EE" stroke-opacity="0.55" />
        <text x="91" y="256" fill="#67E8F9">JAVA</text>
        <rect x="170" y="234" width="142" height="34" rx="9" fill="#151D3D" stroke="#70A5FD" stroke-opacity="0.55" />
