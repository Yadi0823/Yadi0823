      <text x="165" y="306" text-anchor="middle" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">ROUTE · MEMORY · RELATIONSHIPS</text>
    </g>

    <path d="M778 37h-30v30M1128 37h30v30M778 323h-30v-30M1128 323h30v-30" fill="none" stroke="#70A5FD" stroke-opacity="0.32" stroke-width="2" />
    <rect x="1.5" y="1.5" width="1197" height="357" rx="26.5" fill="none" stroke="url(#edge)" stroke-opacity="0.58" stroke-width="3" />
