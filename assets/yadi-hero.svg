        <circle cx="165" cy="149" r="49" fill="none" stroke="#70A5FD" stroke-opacity="0.16" stroke-width="7" />
        <circle cx="165" cy="149" r="43" fill="#101A34" stroke="url(#edge)" stroke-width="3" />
        <text x="165" y="143" fill="#F8FAFC" font-size="21">MULTI</text>
        <text x="165" y="168" fill="#A5F3FC" font-size="21">AGENT</text>

        <circle cx="165" cy="51" r="26" fill="#10243A" stroke="#22D3EE" stroke-width="2" />
        <text x="165" y="56" fill="#A5F3FC" font-size="12">PM</text>
        <circle cx="263" cy="149" r="26" fill="#21163B" stroke="#A855F7" stroke-width="2" />
        <text x="263" y="154" fill="#E9D5FF" font-size="11">TECH</text>
        <circle cx="165" cy="247" r="26" fill="#102A25" stroke="#34D399" stroke-width="2" />
        <text x="165" y="252" fill="#A7F3D0" font-size="11">STRAT</text>
        <circle cx="67" cy="149" r="26" fill="#302114" stroke="#F59E0B" stroke-width="2" />
